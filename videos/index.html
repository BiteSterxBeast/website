<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="disabled-adaptations" content="watch">
<title>All Videos · BiteSterxBeast</title>
<meta name="description" content="Every BiteSterxBeast video, channel by channel.">
<meta name="theme-color" content="#ff8000">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(18, 10, 8, 0.78);
    --panel-border: rgba(255, 255, 255, 0.10);
    --text: #ffffff;
    --muted: #e8d9cf;
    --dim: #a8968a;
    --yellow: #ffe600;
    --red: #ff2a00;
    --ink: #1a0d05;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  * { -webkit-hyphens: manual; hyphens: manual; }
  html { background: #ff4a00; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: 'Nunito', system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.6;
    background-image: url("/bolts.png"), linear-gradient(135deg, #ffff00 0%, #ff9a00 45%, #ff1a00 100%);
    background-size: 64px 62px, 100% 100%;
    background-repeat: repeat, no-repeat;
    background-attachment: scroll, fixed;
    animation: drift 20s linear infinite;
  }
  @keyframes drift { to { background-position: 64px -62px, 0 0; } }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 40px; }

  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .logo {
    font-family: 'Lilita One', sans-serif; font-size: 2rem; line-height: 1; letter-spacing: 1px;
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(26,13,5,.35);
  }
  .spacer { flex: 1; }
  .pillbtn {
    background: rgba(18, 10, 8, 0.8); border: 2px solid transparent; border-radius: 999px;
    padding: 6px 16px; font-weight: 800; transition: border-color .15s, transform .15s;
  }
  .pillbtn:hover { border-color: var(--yellow); transform: translateY(-2px); }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 2px solid var(--panel-border); border-radius: 20px; padding: 28px;
  }
  h1, h2 { font-family: 'Lilita One', sans-serif; font-weight: 400; letter-spacing: .5px; }
  h2 { font-size: 2rem; margin-bottom: 14px; }

  /* ---------- page ---------- */
  .wrap { max-width: 1000px; }
  h1.title {
    font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; margin-bottom: 18px; color: #fff;
    -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 rgba(26,13,5,.35);
  }
  .panel + .panel { margin-top: 20px; }
  section[id] { scroll-margin-top: 16px; }
  .empty { color: var(--muted); padding: 12px 0; }

  .chead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .av {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lilita One', sans-serif; font-size: 1.4rem; color: var(--ink);
  }
  .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .chead .grow { flex: 1; min-width: 0; }
  .chead h2 { margin: 0; line-height: 1.1; }
  .chead .sub { color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chead .yt {
    flex-shrink: 0; font-weight: 800; font-size: .82rem; background: var(--red); color: #fff;
    border-radius: 999px; padding: 5px 13px; transition: transform .15s;
  }
  .chead .yt:hover { transform: translateY(-2px); }

  /* one swipeable row per type */
  .rowh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 8px; }
  .rowh h3 { font-weight: 800; font-size: 1.05rem; color: var(--yellow); }
  .rowh h3 small { color: var(--muted); font-size: .85rem; }
  .arrs { display: flex; gap: 6px; }
  .arr {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; font-weight: 800; font-size: 1.15rem; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding-bottom: 2px;
    transition: background .15s, color .15s, transform .1s;
  }
  .arr:hover:not(:disabled) { background: var(--yellow); color: var(--ink); }
  /* stays lit and pressed while the slide plays, so it can't be spammed */
  .arr.cooling { background: var(--yellow); color: var(--ink); transform: scale(.9); cursor: default; }
  .arr:disabled:not(.cooling) { opacity: .3; cursor: default; }
  .arrs.gone { visibility: hidden; }

  .strip {
    display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none;
    scroll-behavior: smooth; scroll-snap-type: x mandatory; padding: 4px 2px 6px;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip .vcard { flex: 0 0 220px; scroll-snap-align: start; }
  .strip.tall .vcard { flex: 0 0 130px; }

  .vcard { display: block; transition: transform .15s; }
  .vcard:hover { transform: translateY(-3px); }
  .vcard:hover .thumb { border-color: var(--yellow); }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
    background: #2a1c14; border: 2px solid rgba(255,255,255,.06); transition: border-color .15s;
  }
  .strip.tall .thumb { aspect-ratio: 9 / 16; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 7px; left: 7px; padding: 1px 8px; border-radius: 6px;
    font-size: .7rem; font-weight: 800; background: var(--yellow); color: var(--ink);
  }
  .badge.short { background: var(--red); color: #fff; }
  .vtitle {
    font-weight: 800; font-size: .9rem; line-height: 1.3; margin-top: 7px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .vmeta { color: var(--muted); font-size: .8rem; }

  /* sort tabs (like YouTube) */
  .sorts { display: flex; gap: 6px; margin: 12px 0 2px; flex-wrap: wrap; }
  .sorts button { font-weight: 800; font-size: .82rem; border: 0; border-radius: 8px; padding: 4px 12px; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; transition: background .15s; }
  .sorts button:hover { background: rgba(255,255,255,.18); }
  .sorts button.on { background: #fff; color: var(--ink); }

  /* black fade + Show more at the end of a row (after 5 arrow presses' worth of videos) */
  .strip { position: relative; }
  .more-tile { flex: 0 0 150px; scroll-snap-align: end; position: relative; margin-left: -70px; z-index: 1;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 6px;
    background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.92) 55%); border-radius: 0 12px 12px 0; }
  .strip.tall .more-tile { flex-basis: 120px; margin-left: -50px; }
  .more-tile a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: .9rem; color: #fff; text-align: center; }
  .more-tile a b { width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem; transition: transform .15s; }
  .more-tile a:hover b { transform: scale(1.1); }

  /* full list page */
  .lhead { display: flex; align-items: center; gap: 12px; }
  .lhead .back { font-weight: 800; font-size: .85rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: 5px 13px; cursor: pointer; }
  .lhead .back:hover { background: var(--yellow); color: var(--ink); }
  .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 16px; margin-top: 14px; }
  .lgrid.tall { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .lgrid.tall .thumb { aspect-ratio: 9 / 16; }
  .lcount { color: var(--muted); font-size: .9rem; font-weight: 800; }


  footer { text-align: center; margin-top: 28px; font-weight: 800; color: var(--ink); opacity: .75; }

  @media (max-width: 600px) {
    .panel { padding: 18px; }
    .strip .vcard { flex-basis: 180px; }
    .strip.tall .vcard { flex-basis: 115px; }
    .chead .yt { padding: 4px 10px; font-size: .75rem; }
  }

  /* ---------- APPLE WATCH (and other tiny screens) ---------- */
  @media (max-width: 260px) {
    html, body { overflow-x: hidden; }
    /* still bolts, no drift; gradient pinned to the screen so every part of the page looks the same */
    body { animation: none; background: none; }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: url("/bolts.png"), linear-gradient(135deg, #ffff00 0%, #ff9a00 45%, #ff1a00 100%);
      background-size: 48px 46px, 100% 100%;
      background-repeat: repeat, no-repeat;
    }
    .panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(18, 10, 8, 0.86); }

    .wrap { padding: 16px 8px 24px; }
    .logo { font-size: 1.3rem; -webkit-text-stroke: 3px var(--ink); width: 100%; text-align: center; }
    .top { justify-content: center; gap: 6px; }
    .spacer { display: none; }
    .pillbtn { padding: 3px 10px; font-size: 0.8rem; }
    .panel { padding: 12px; border-radius: 14px; }
    h2 { font-size: 1.35rem; }
    .strip .vcard { flex-basis: 150px; }
    .strip.tall .vcard { flex-basis: 100px; }
    .chead .yt { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="/">BiteSterxBeast</a>
    <div class="spacer"></div>
    <a class="pillbtn" href="/">Home</a>
  </div>
  <h1 class="title" id="pageTitle">All Videos</h1>
  <div id="app"><section class="panel"><div class="empty">Loading videos...</div></section></div>
  <footer>© 2026 BiteSterxBeast</footer>
</div>

<script>
const CHANNELS = [
  { name: 'Main',        handle: 'BiteSterxBeast',            color: '#ffe600' },
  { name: 'Experiments', handle: 'BiteSterxBeastExperiments', color: '#00e1ff' },
  { name: 'Extras',      handle: 'BiteSterxBeastExtras',      color: '#ff4fd8' },
  { name: 'Minecraft',   handle: 'BitePlaysMC',               color: '#7cff4f' },
  { name: 'JoshSham',    handle: 'JoshSham',                  color: '#ff7a3a' },
];
let VIDEOS = [], AVATARS = {};
const TYPE_NAME = { long: 'Long-forms', short: 'Shorts' };
const SORTS = { newest: 'Newest', oldest: 'Oldest', views: 'Most viewed' };
const ROW_LIMIT = 10; // videos shown in a row before the black fade + "Show more"

const esc = (t) => String(t || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const timeAgo = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  for (const [name, secs] of [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]]) {
    const n = Math.floor(s / secs); if (n >= 1) return `${n} ${name}${n > 1 ? 's' : ''} ago`;
  }
  return 'just now';
};
// 1234 -> 1.2K, 3400000 -> 3.4M (like YouTube)
const fmtViews = (n) => {
  if (n == null) return '';  // old saved videos get views on the next full sync
  const f = (x, u) => (x >= 100 ? Math.floor(x) : Math.floor(x * 10) / 10) + u;
  const t = n >= 1e9 ? f(n / 1e9, 'B') : n >= 1e6 ? f(n / 1e6, 'M') : n >= 1e3 ? f(n / 1e3, 'K') : String(n);
  return `${t} view${n === 1 ? '' : 's'}`;
};
const sortBy = (vs, how) => vs.slice().sort(
  how === 'oldest' ? (a, b) => a.published.localeCompare(b.published)
: how === 'views'  ? (a, b) => (b.views || 0) - (a.views || 0)
:                    (a, b) => b.published.localeCompare(a.published));

const link = (v) => v.type === 'short'
  ? `https://www.youtube.com/shorts/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
const card = (v) => `
  <a class="vcard" href="${link(v)}" target="_blank" rel="noopener">
    <div class="thumb"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy">
      <span class="badge${v.type === 'short' ? ' short' : ''}">${v.type === 'short' ? 'Short' : 'Video'}</span></div>
    <div class="vtitle">${esc(v.title)}</div>
    <div class="vmeta">${[fmtViews(v.views), timeAgo(v.published)].filter(Boolean).join(' · ')}</div>
  </a>`;

// Profile picture, or the channel's letter if there isn't one (or it fails to load)
function avatarImg(c) {
  const url = AVATARS[c.name] && AVATARS[c.name].avatar;
  if (!url) return c.name[0];
  return `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer"
    onerror="this.parentElement.textContent='${c.name[0]}'">`;
}

const app = document.getElementById('app');
const sortState = {}; // per channel

// ---------- main page: channel panels with rows ----------
function renderHome() {
  document.getElementById('pageTitle').textContent = 'All Videos';
  app.innerHTML = CHANNELS.map(c => {
    const mine = VIDEOS.filter(v => v.channel === c.name);
    const how = sortState[c.name] || 'newest';
    const rows = ['long', 'short'].map(t => {
      const vs = sortBy(mine.filter(v => v.type === t), how);
      if (!vs.length) return '';
      return `
        <div class="rowh">
          <h3>${TYPE_NAME[t]} <small>· ${vs.length}</small></h3>
          <div class="arrs"><button class="arr" data-d="-1" aria-label="Back">‹</button><button class="arr" data-d="1" aria-label="Next">›</button></div>
        </div>
        <div class="strip${t === 'short' ? ' tall' : ''}" data-ch="${c.name}" data-type="${t}" data-total="${vs.length}">${vs.map(card).join('')}</div>`;
    }).join('');
    return `
      <section class="panel" id="${c.name.toLowerCase()}">
        <div class="chead">
          <div class="av" style="background:${c.color}">${avatarImg(c)}</div>
          <div class="grow"><h2>${esc(c.name)}</h2><div class="sub">@${c.handle} · ${mine.length} video${mine.length === 1 ? '' : 's'}</div></div>
          <a class="yt" href="https://www.youtube.com/@${c.handle}" target="_blank" rel="noopener">YouTube ↗</a>
        </div>
        ${mine.length ? `<div class="sorts" data-ch="${c.name}">${Object.entries(SORTS).map(([k, n]) =>
            `<button data-s="${k}" class="${k === how ? 'on' : ''}">${n}</button>`).join('')}</div>` : ''}
        ${rows || '<div class="empty">No uploads yet.</div>'}
      </section>`;
  }).join('');
  app.querySelectorAll('.sorts button').forEach(b => b.onclick = () => {
    const ch = b.parentElement.dataset.ch; sortState[ch] = b.dataset.s;
    const y = scrollY; renderHome(); scrollTo(0, y);
  });
  setupRows();
}

// Each row shows the first 10 videos, then a black fade + "Show more" that opens the full list
function setupRows() {
  document.querySelectorAll('.strip').forEach(strip => {
    const cards = [...strip.children];
    const first = cards[0]; if (!first) return;
    const gap = 14, step = first.offsetWidth + gap;
    const perScreen = Math.max(1, Math.floor((strip.clientWidth + gap) / step));
    strip.dataset.slide = Math.max(1, Math.floor(perScreen * 0.85)) * step;   // one press = whole cards
    if (cards.length > ROW_LIMIT) {
      cards.slice(ROW_LIMIT).forEach(c => c.remove());
      const { ch, type, total } = strip.dataset;
      strip.insertAdjacentHTML('beforeend', `<div class="more-tile"><a href="#list-${ch.toLowerCase()}-${type}">
        <b>→</b>Show more<small style="color:var(--muted)">all ${total}</small></a></div>`);
    }
  });

  document.querySelectorAll('.rowh').forEach(head => {
    const strip = head.nextElementSibling;
    const arrs = head.querySelector('.arrs');
    const [back, next] = arrs.querySelectorAll('.arr');
    let sliding = false;
    const update = () => {
      const max = strip.scrollWidth - strip.clientWidth;
      arrs.classList.toggle('gone', max <= 2);
      if (sliding) return;
      back.disabled = strip.scrollLeft <= 2;
      next.disabled = strip.scrollLeft >= max - 2;
    };
    const go = (btn) => {
      if (sliding) return;
      sliding = true; back.disabled = next.disabled = true; btn.classList.add('cooling');
      let done = false;
      const finish = () => { if (done) return; done = true; strip.removeEventListener('scrollend', finish);
        sliding = false; btn.classList.remove('cooling'); update(); };
      strip.addEventListener('scrollend', finish); setTimeout(finish, 700);
      strip.scrollBy({ left: Number(btn.dataset.d) * Number(strip.dataset.slide), behavior: 'smooth' });
    };
    back.onclick = () => go(back); next.onclick = () => go(next);
    strip.addEventListener('scroll', update, { passive: true });
    update();
  });
}

// ---------- full list: one channel, one type, every video ----------
let listSort = 'newest';
function renderList(chKey, type) {
  const c = CHANNELS.find(x => x.name.toLowerCase() === chKey);
  if (!c || !TYPE_NAME[type]) return renderHome();
  const vs = sortBy(VIDEOS.filter(v => v.channel === c.name && v.type === type), listSort);
  document.getElementById('pageTitle').textContent = `${c.name} · ${TYPE_NAME[type]}`;
  app.innerHTML = `
    <section class="panel">
      <div class="lhead">
        <a class="back" href="#${chKey}">← Back</a>
        <div class="grow"><span class="lcount">${vs.length} ${TYPE_NAME[type].toLowerCase()}</span></div>
      </div>
      <div class="sorts">${Object.entries(SORTS).map(([k, n]) => `<button data-s="${k}" class="${k === listSort ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="lgrid${type === 'short' ? ' tall' : ''}">${vs.map(card).join('')}</div>
    </section>`;
  app.querySelectorAll('.sorts button').forEach(b => b.onclick = () => { listSort = b.dataset.s; renderList(chKey, type); });
  scrollTo(0, 0);
}

function route() {
  const m = location.hash.match(/^#list-([a-z]+)-(long|short)$/);
  if (m) return renderList(m[1], m[2]);
  renderHome();
  const el = location.hash && document.getElementById(location.hash.slice(1));
  if (el) el.scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', route);

fetch('/videos.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => { VIDEOS = data.recent || []; AVATARS = data.channels || {}; route(); })
  .catch(() => { app.innerHTML = '<section class="panel"><div class="empty">Videos coming soon.</div></section>'; });
</script>
</body>
</html>
