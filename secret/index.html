<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Box</title>
<meta name="description" content="You shouldn't be here.">
<meta name="theme-color" content="#050302">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050302;
    --ink: #d9c9bd;
    --dim: #6e5f55;
    --ember: #ff8a00;
    --red: #ff1f1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Mono', ui-monospace, monospace;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* the site's bolts, barely visible in the dark, drifting slowly */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: -64px; right: 0; bottom: -62px;
    background: url("/bolts.png") 0 0 / 64px 62px repeat;
    opacity: 0.06;
    filter: sepia(1) saturate(4) hue-rotate(-30deg);
    animation: drift 60s linear infinite;
    pointer-events: none;
  }
  @keyframes drift { to { transform: translate(64px, -62px); } }

  /* a faint glow in the middle, dark at the edges */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255, 90, 0, 0.10) 0%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.85) 100%);
    pointer-events: none;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: 0.55; } }

  /* scanlines */
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px);
  }

  main {
    position: relative;
    z-index: 3;
    width: min(520px, calc(100vw - 32px));
    text-align: center;
  }

  h1 {
    font-family: 'Lilita One', sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    letter-spacing: 3px;
    line-height: 1;
    color: #f2e3d6;
    text-shadow: 0 0 18px rgba(255, 120, 0, 0.35);
    animation: flicker 7s infinite;
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.35; }
    94% { opacity: 1; }
    96% { opacity: 0.5; }
    97% { opacity: 1; }
  }

  .whisper {
    margin-top: 14px;
    color: var(--dim);
    font-size: 0.95rem;
    letter-spacing: 1px;
    min-height: 1.5em;
  }
  .whisper .cursor { display: inline-block; width: 0.6em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  form { margin-top: 34px; }
  .field {
    display: flex;
    border: 2px solid rgba(255, 138, 0, 0.35);
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.6);
    box-shadow: 0 0 0 rgba(255, 138, 0, 0);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field:focus-within {
    border-color: var(--ember);
    box-shadow: 0 0 22px rgba(255, 138, 0, 0.25);
  }
  input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: none;
    color: #fff;
    font: inherit;
    font-size: 1.15rem;
    letter-spacing: 4px;
    text-transform: lowercase;
    padding: 14px 16px;
  }
  input::placeholder { color: #4d4038; letter-spacing: 2px; }
  ::selection { background: rgba(255, 31, 31, 0.45); color: #fff; }
  button {
    font: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ember);
    background: none;
    border: 0;
    border-left: 2px solid rgba(255, 138, 0, 0.25);
    padding: 0 18px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  button:hover { background: rgba(255, 138, 0, 0.08); color: #ffd21f; }
  button:disabled { cursor: wait; opacity: 0.6; }

  .msg {
    margin-top: 14px;
    min-height: 1.5em;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--red);
    opacity: 0;
    transition: opacity 0.2s;
  }

  /* wrong code */
  .wrong .field {
    border-color: var(--red);
    background: rgba(255, 0, 0, 0.18);
    box-shadow: 0 0 26px rgba(255, 30, 30, 0.45);
    animation: shake 0.42s;
  }
  .wrong input { color: #ffb3b3; }
  .wrong .msg { opacity: 1; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(4px); }
  }

  /* right code */
  .right .field { border-color: #ffd21f; box-shadow: 0 0 40px rgba(255, 210, 31, 0.5); }
  .fade { position: fixed; inset: 0; z-index: 10; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
  .right ~ .fade, body.leaving .fade { opacity: 1; }

  .home {
    position: fixed; left: 16px; bottom: 14px; z-index: 3;
    color: #3d322b; font-size: 0.8rem; text-decoration: none; letter-spacing: 1px;
    transition: color 0.2s;
  }
  .home:hover { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, h1, .whisper .cursor { animation: none; }
    .wrong .field { animation: none; }
  }
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>

<main id="box">
  <h1>SECRET BOX</h1>
  <p class="whisper"><span id="whisper"></span><span class="cursor">_</span></p>

  <form id="form" autocomplete="off">
    <div class="field">
      <input id="code" name="code" type="text" placeholder="enter the code" maxlength="40"
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Secret code">
      <button id="go" type="submit">ENTER</button>
    </div>
    <p class="msg" id="msg" role="alert">NOT RIGHT.</p>
  </form>
</main>

<div class="fade" aria-hidden="true"></div>
<a class="home" href="/">&larr; leave</a>

<script>
  /* How codes work:
     Every code is just a folder inside /secret/. "wave" works because /secret/wave/ exists.
     To add a new code, add a folder like /secret/mycode/index.html. Nothing to change here,
     and the codes never appear in this page's source. */

  const box = document.getElementById('box');
  const form = document.getElementById('form');
  const input = document.getElementById('code');
  const go = document.getElementById('go');

  // typed-out line under the title
  const lines = ['you found the box.', 'it only opens for those who know.', 'type the code.'];
  const whisper = document.getElementById('whisper');
  let li = 0, ci = 0;
  (function type() {
    const line = lines[li];
    if (ci <= line.length) {
      whisper.textContent = line.slice(0, ci++);
      setTimeout(type, 55);
    } else {
      setTimeout(() => {
        if (li < lines.length - 1) { li++; ci = 0; }
        else return;
        type();
      }, 1400);
    }
  })();

  let wrongTimer;
  function wrong() {
    clearTimeout(wrongTimer);
    box.classList.remove('wrong');
    void box.offsetWidth; // restart the shake
    box.classList.add('wrong');
    input.select();
    wrongTimer = setTimeout(() => box.classList.remove('wrong'), 1600);
  }

  async function exists(url) {
    try {
      const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      return r.ok;
    } catch (e) {
      return false;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = input.value.trim().toLowerCase();
    // only letters, numbers and dashes can ever be a code
    if (!/^[a-z0-9-]+$/.test(code)) { wrong(); return; }

    go.disabled = true;
    const url = `/secret/${code}/`;
    const ok = await exists(url);
    go.disabled = false;

    if (!ok) { wrong(); return; }
    box.classList.remove('wrong');
    box.classList.add('right');
    document.body.classList.add('leaving');
    setTimeout(() => { location.href = url; }, 650);
  });

  input.addEventListener('input', () => box.classList.remove('wrong'));
  input.focus();
</script>
</body>
</html>
